<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
<style>
    body{
      background-color: aliceblue;
      margin: 0;
      min-height: auto;
      font-family:'Franklin Gothic Medium';
    }
     section{
        display: block;
        margin: auto;
        width: 600px;
        height: auto;
        background-color:rgb(118, 174, 234);
        box-shadow: 0px 3px 10px rgb(72, 66, 66);
        padding: 15px;
         }
        header{
            text-align: center;
        }

         img{
            height: 200px;
            width: 200px;
         }
         select, input[type="submit"], textarea{
          width: 100%;
          border-radius: 5px;
          
         }
</style>
</head>
<body>
    <header>
       <h1>Rate A movie</h1> 
       <img src="https://i.pinimg.com/1200x/bf/61/a8/bf61a81c6f202c89c6994a61f7799e24.jpg" alt="movie logo">
       <p>Say something about the content</p>
    </header>
    <br> 

    <section> 
        <form action="">
            <label for="">Select A Movie</label>
            <select id="movie" name="movie">
                <option value="movie1">Mayday</option> 
                <option value="movie2">Nanny Diaries</option> 
                <option value="movie3">Me Before You</option> 
                <option value="movie4">Spider-Man: Across the Spider-Verse</option> 
                 <option value="movie4">Insidious: The Red Door</option> 
            </select>
            <br>

            <label for="Genre">Genre/s</label>
            <br>
            <input type="checkbox" id="Genre1" name="genre1" value="genre1">
            <label for="Genre1">Action</label>
              <input type="checkbox" id="Genre2" name="genre2" value="genre2">
            <label for="Genre2">Rom-com</label>
              <input type="checkbox" id="Genre3" name="genre3" value="genre3">
            <label for="Genre3">Drama</label>
              <input type="checkbox" id="Genre4" name="genre4" value="genre4">
            <label for="Genre4">Animation</label>
              <input type="checkbox" id="Genre5" name="genre5" value="genre5">
            <label for="Genre5">Horror</label>

            <br><br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rating" value="rate1">
            <label for="rate1">⭐️</label>
            <input type="radio" id="rate2" name="rating" value="rate2">
            <label for="rate1">⭐️⭐️</label><input type="radio" id="rate2" name="rating" value="rate2">
            <label for="rate1">⭐️⭐️⭐️</label><input type="radio" id="rate3" name="rating" value="rate3">
            <label for="rate1">⭐️⭐️⭐️⭐️</label><input type="radio" id="rate4" name="rating" value="rate4">
          <input type="radio" id="rate5" name="rating" value="rate5">
            <label for="rate1">⭐️⭐️⭐️⭐️⭐️</label>
            <br><br>

            <textarea id="review" name="review" cols="40" rows="4"
            placeholder="write your review here..."></textarea>
            
            <br><br>

            <input type="submit" id="submit" name="submit" value="Submit a Review">

            <br>
            For more review tips, click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here.</a>
            </form>
    </section>

</body>
</html>
